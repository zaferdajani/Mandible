name: Android sync test (emulator)

# Builds an x86_64 debug APK, runs it on an Android emulator with --synctest and saves the
# checksum trail. Android uses the Mono .NET runtime (desktop uses CoreCLR), so matching the
# Windows trail proves phones and PCs compute bit-identical games and can play together.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  android-synctest:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Godot (.NET) and export templates
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip && unzip -q templates.tpz && rm godot.zip templates.tpz
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest" && cp -R templates/* "$dest/"
          echo "GODOT=$(ls ~/godot/Godot_v*_mono_linux_x86_64/Godot_v*_mono_linux.x86_64)" >> $GITHUB_ENV

      - name: Debug keystore and Godot editor settings
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.7.tres

      - name: Build an x86_64 APK for the emulator
        run: |
          sed -i 's/^architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          dotnet build -c ExportDebug
          "$GODOT" --headless --path . --import || true
          mkdir -p build
          "$GODOT" --headless --path . --export-debug "Android" build/Mandible.apk
          ls -la build

      - name: Run the sync test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android-synctest.sh build/Mandible.apk 600

      - name: Upload sync trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synctest-android
          path: |
            synctest-android.txt
            logcat-tail.txt
