name: Build iOS App (Godot, unsigned for sideloading)

# Builds an UNSIGNED Mandible.ipa on a cloud Mac. A free Apple ID cannot sign in CI, so the
# IPA is signed and installed from Windows with Sideloadly or AltStore (re-sign every 7 days).
on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  BUNDLE_ID: com.mandible.warbeneaththegrass
  TEAM_ID: KVX7JSZ5VY   # Apple team id (public identifier, not a secret)

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install .NET iOS workload
        run: sudo dotnet workload install ios

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono

      - name: Download Godot (.NET) and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip && unzip -q templates.tpz && rm godot.zip templates.tpz

      - name: Install export templates
        run: |
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest"
          cp -R ~/godot/templates/* "$dest/"
          echo "GODOT=$(ls -d ~/godot/Godot_mono.app)/Contents/MacOS/Godot" >> $GITHUB_ENV

      - name: Configure the iOS export (Xcode project only, local-network permission text)
        run: |
          python3 - <<'EOF'
          import os, re
          p = "export_presets.cfg"
          t = open(p, encoding="utf-8").read()
          head, sep, body = t.partition('[preset.2.options]')
          plist = ('<key>NSLocalNetworkUsageDescription</key>'
                   '<string>Mandible finds and connects to friends playing on the same Wi-Fi.</string>')
          opts = {
            "application/app_store_team_id": f'"{os.environ["TEAM_ID"]}"',
            "application/bundle_identifier": f'"{os.environ["BUNDLE_ID"]}"',
            "application/export_project_only": "true",
            "application/additional_plist_content": '"' + plist.replace('"', '\\"') + '"',
          }
          for k, v in opts.items():
              line = f"{k}={v}"
              if re.search(rf"^{re.escape(k)}=", body, re.M):
                  body = re.sub(rf"^{re.escape(k)}=.*$", lambda m: line, body, flags=re.M)
              else:
                  body = body.replace("\n", "\n" + line + "\n", 1)
          open(p, "w", encoding="utf-8").write(head + sep + body)
          EOF

      - name: Build C# and import assets
        run: |
          dotnet build -c ExportRelease
          "$GODOT" --headless --path . --import || true

      - name: Export the Xcode project
        run: |
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/Mandible.xcodeproj
          ls -la build/ios

      - name: Compile without signing
        run: |
          cd build/ios
          xcodebuild -project Mandible.xcodeproj -scheme Mandible -configuration Release -sdk iphoneos \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA
        run: |
          cd build/ios
          app=$(find dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qr Mandible-unsigned.ipa Payload
          ls -la Mandible-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mandible-ios-unsigned
          path: build/ios/Mandible-unsigned.ipa

      - name: Upload the Xcode project on failure (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mandible-ios-xcode
          path: |
            build/ios
            !build/ios/dd
