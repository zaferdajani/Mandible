name: Build macOS App (Godot .NET, universal)

# Builds a universal (Apple Silicon + Intel) Mandible.app on a cloud Mac, ad-hoc signed,
# then launches the exported app headless and plays a short AI match to prove it really runs on macOS.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono

      - name: Download Godot (.NET) and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip && unzip -q templates.tpz && rm godot.zip templates.tpz

      - name: Install export templates
        run: |
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest"
          cp -R ~/godot/templates/* "$dest/"
          echo "GODOT=$(ls -d ~/godot/Godot_mono.app)/Contents/MacOS/Godot" >> $GITHUB_ENV

      - name: Build C# and import assets
        run: |
          dotnet build -c ExportRelease
          "$GODOT" --headless --path . --import || true

      - name: Export the macOS app
        run: |
          mkdir -p build/macos
          "$GODOT" --headless --path . --export-release "macOS" build/macos/Mandible-macOS.zip
          ls -la build/macos

      - name: Ad-hoc sign every binary with Apple's own codesign
        # Godot's built-in signer leaves the .NET runtime libraries in a state Apple Silicon kills on
        # launch ("Killed: 9"); re-signing inside-out with the real codesign tool fixes it.
        run: |
          cd build/macos
          unzip -q Mandible-macOS.zip -d run
          app=$(find run -name "*.app" -maxdepth 2 | head -1)
          cat > ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          EOF
          find "$app/Contents" \( -name "*.dylib" -o -name "*.so" \) -exec codesign --force --sign - {} \;
          codesign --force --sign - --entitlements ent.plist "$app/Contents/MacOS/"*
          codesign --force --sign - --entitlements ent.plist "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          rm Mandible-macOS.zip
          ditto -c -k --keepParent "$app" Mandible-macOS.zip
          echo "APP=$PWD/$app" >> $GITHUB_ENV

      - name: Smoke test - run the exported app on this Mac
        run: |
          exe="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS/" | head -1)"
          lipo -info "$exe"
          set +e
          "$exe" --headless -- --simtest=90,Normal,Normal > smoke.log 2>&1
          code=$?
          set -e
          echo "exit code $code"
          tail -n 12 smoke.log
          grep -q "\[simtest\] finished" smoke.log

      - name: Cross-platform sync test (compare with the Windows trail)
        run: |
          exe="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS/" | head -1)"
          "$exe" --headless -- --synctest=600 2>&1 | grep "\[synctest\]" | tee synctest-macos.txt

      - name: Upload sync trail
        uses: actions/upload-artifact@v4
        with:
          name: synctest-macos
          path: synctest-macos.txt

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Mandible-macOS
          path: build/macos/Mandible-macOS.zip
